  <text x="1150" y="365" font-size="23" font-weight="700">Pareto shortlist</text>
  <text x="1150" y="394" class="small">Trade-off candidates</text>
  <rect x="1054" y="454" width="322" height="104" rx="11" fill="#f8fafc" stroke="#dce4ed"/>
  <circle cx="1104" cy="505" r="28" fill="none" stroke="#8ca4be" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="1104" cy="505" r="7" fill="#18324b"/>
  <circle cx="1091" cy="486" r="5.5" fill="#087f8c"/>
  <circle cx="1120" cy="497" r="5.5" fill="#087f8c"/>
  <circle cx="1091" cy="520" r="5.5" fill="#087f8c"/>
  <circle cx="1073" cy="475" r="4.5" fill="#b6c3d2"/>
  <circle cx="1134" cy="533" r="4.5" fill="#b6c3d2"/>
  <text x="1150" y="494" font-size="22" font-weight="700">Embedding retrieval</text>
  <text x="1150" y="523" class="small">Similar structures</text>
  <text x="1054" y="590" class="body">Existing candidate structures</text>

  <rect x="40" y="642" width="1360" height="164" rx="18" fill="#fff" stroke="#d5e0ec" stroke-width="1.5"/>
  <text x="64" y="675" class="eyebrow">CONTROLLED COMPARISON</text>
  <text x="64" y="716" font-size="25" font-weight="700">Separate joint learning</text>
  <text x="64" y="748" font-size="25" font-weight="700">from the choice of head.</text>
  <text x="64" y="781" class="small">Same backbone architecture in all four variants.</text>
  <rect x="580" y="662" width="796" height="124" rx="9" fill="#f8fafc" stroke="#dce4ed"/>
  <rect x="581" y="745" width="794" height="40" fill="#eaf2fb"/>
  <path d="M580 704 H1376 M580 744 H1376 M760 662 V786 M1070 662 V786" stroke="#dce4ed" stroke-width="1.2"/>
  <text x="915" y="690" text-anchor="middle" font-size="20" font-weight="700">Energy matching (MEX)</text>
  <text x="1223" y="690" text-anchor="middle" font-size="20" font-weight="700">Regression (ERM)</text>
  <text x="598" y="731" font-size="20">Single property</text>
  <text x="915" y="731" text-anchor="middle" font-size="22" font-weight="700">MEX-Single</text>
  <text x="1223" y="731" text-anchor="middle" font-size="22" font-weight="700">ERM-Single</text>
  <text x="598" y="773" font-size="20">Joint properties</text>
  <text x="915" y="773" text-anchor="middle" font-size="22" font-weight="700">MEX-Multi</text>
  <text x="1223" y="773" text-anchor="middle" font-size="22" font-weight="700">ERM-Multi</text>
  <text x="44" y="839" font-size="17" fill="#63788e">Conceptual diagram · Architecture and retrieval flow; the icons are illustrative, not experimental measurements.</text>
</svg>
