  <text x="737" y="439" font-size="24" font-weight="700">Band gap</text>
  <text x="737" y="468" class="body">eV</text>
  <text x="737" y="542" font-size="24" font-weight="700">Bulk modulus</text>
  <text x="737" y="571" class="body">log₁₀(GPa)</text>
  <path d="M974 344 H1008 M974 446 H1008 M974 550 H1008 M1008 344 V550" class="flow"/>
  <path d="M1008 375 H1049" class="flow" marker-end="url(#arrow)"/>
  <path d="M596 442 H640 V626 H1018 V505 H1049" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="728" y="613" width="210" height="24" rx="4" fill="#f3f6fa"/>
  <text x="833" y="631" text-anchor="middle" font-size="17">Learned embedding</text>

  <text x="1054" y="229" class="eyebrow">03  INVERSE DESIGN</text>
  <text x="1054" y="267" class="panel-title">Select from the library</text>
  <text x="1054" y="297" class="small">Predictions + learned embeddings</text>
  <rect x="1054" y="325" width="322" height="104" rx="11" fill="#f8fafc" stroke="#dce4ed"/>
  <path d="M1080 350 Q1084 386 1122 397" fill="none" stroke="#087f8c" stroke-width="2.4"/>
