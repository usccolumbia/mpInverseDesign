<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="858" viewBox="0 0 1440 858" role="img" aria-labelledby="title description">
  <title id="title">mpInverseDesign: joint multi-property learning for crystal inverse design</title>
  <desc id="description">Crystal structures are encoded with a shared SE(3)-equivariant EquiformerV2 backbone and separate formation-energy, band-gap and bulk-modulus heads. Predicted properties support Pareto selection, while learned embeddings support retrieval from an existing crystal library. A two-by-two comparison separates single versus joint training from energy matching versus regression heads. All icons are schematic.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 1.1px; fill: #53677d; }
      .panel-title { font-size: 26px; font-weight: 700; }
      .body { font-size: 20px; fill: #52677b; }
      .small { font-size: 18px; fill: #52677b; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.6; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1440" height="858" fill="#f3f6fa"/>
  <text x="44" y="58" font-size="22" font-weight="700" fill="#087f8c">mpInverseDesign</text>
  <text x="44" y="112" font-size="42" font-weight="700">Joint learning for crystal inverse design</text>
  <text x="44" y="153" font-size="24" fill="#52677b">One shared representation · Three property targets · Selection from a crystal library</text>

  <rect x="40" y="192" width="280" height="420" rx="18" fill="#fff" stroke="#d5e0ec" stroke-width="1.5"/>
  <rect x="350" y="192" width="650" height="420" rx="18" fill="#fff" stroke="#d5e0ec" stroke-width="1.5"/>
  <rect x="1030" y="192" width="370" height="420" rx="18" fill="#fff" stroke="#d5e0ec" stroke-width="1.5"/>

  <text x="64" y="229" class="eyebrow">01  CRYSTAL LIBRARY</text>
  <text x="64" y="267" class="panel-title">Crystal structures</text>
  <g fill="none" stroke="#a8b9cc" stroke-width="2.7" stroke-linejoin="round">
    <path d="M90 368 L200 388 L200 493 L90 473 Z"/>
    <path d="M138 330 L248 350 L248 455 L138 435 Z"/>
    <path d="M90 368 L138 330 M200 388 L248 350 M200 493 L248 455 M90 473 L138 435"/>
    <path d="M169 411 L90 368 M169 411 L200 388 M169 411 L248 350 M169 411 L138 330 M169 411 L90 473 M169 411 L200 493 M169 411 L248 455 M169 411 L138 435" stroke="#cad5e1" stroke-width="1.8"/>
  </g>
  <g stroke="#fff" stroke-width="2.5">
    <circle cx="138" cy="330" r="12" fill="#087f8c"/>
    <circle cx="248" cy="350" r="12" fill="#2563eb"/>
    <circle cx="248" cy="455" r="12" fill="#087f8c"/>
    <circle cx="138" cy="435" r="12" fill="#2563eb"/>
    <circle cx="169" cy="411" r="19" fill="#c87912"/>
    <circle cx="90" cy="368" r="12" fill="#2563eb"/>
    <circle cx="200" cy="388" r="12" fill="#087f8c"/>
    <circle cx="200" cy="493" r="12" fill="#2563eb"/>
    <circle cx="90" cy="473" r="12" fill="#087f8c"/>
  </g>
  <text x="64" y="549" class="body">Species and positions</text>
  <text x="64" y="579" class="body">Periodic crystal graphs</text>
  <path d="M324 412 H345" class="flow" marker-end="url(#arrow)"/>

  <text x="374" y="229" class="eyebrow">02  MULTI-PROPERTY LEARNING</text>
  <text x="374" y="267" class="panel-title">Shared EquiformerV2 representation</text>
  <rect x="374" y="327" width="242" height="150" rx="14" fill="#eff6ff" stroke="#83a6d7" stroke-width="1.8"/>
  <text x="495" y="367" text-anchor="middle" font-size="25" font-weight="700">Crystal encoder</text>
  <text x="495" y="403" text-anchor="middle" font-size="21">SE(3)-equivariant</text>
  <rect x="394" y="425" width="202" height="34" rx="8" fill="#dceafd"/>
  <text x="495" y="448" text-anchor="middle" font-size="18">Shared embedding</text>
  <text x="374" y="523" font-size="24" font-weight="700">Joint supervision</text>
  <text x="374" y="555" class="body">across three properties</text>

  <path d="M616 402 H665 M665 344 V550" class="flow"/>
  <path d="M665 344 H704 M665 446 H704 M665 550 H704" class="flow" marker-end="url(#arrow)"/>
  <rect x="710" y="302" width="264" height="83" rx="11" fill="#eff6ff" stroke="#bcd0ef"/>
